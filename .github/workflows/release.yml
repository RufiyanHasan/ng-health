# Versioning and publishing with Changesets.
#
# On every push to main:
#   - pending changesets → opens/updates a "chore: version packages" PR (version bump + CHANGELOG)
#   - that PR merged (no pending changesets, unpublished version) → publishes to npm with
#     provenance, tags the release and creates a GitHub release
#
# Auth: npm Trusted Publishing (OIDC). No npm token is stored anywhere; npmjs.com trusts this
# workflow file of this repository (package settings → Trusted Publisher → GitHub Actions,
# workflow "release.yml"). Requires npm >= 11.5.1, installed below.

name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # version commit, git tags, GitHub releases
  pull-requests: write # the version PR
  id-token: write # Trusted Publishing + provenance (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: npm with Trusted Publishing support
        run: npm install -g npm@^11.5.1

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run smoke

      - name: Version PR or publish
        uses: changesets/action@v2
        with:
          version-script: npm run version-packages
          # `changeset publish` runs `npm publish` for versions not yet on npm (no-op otherwise);
          # NPM_CONFIG_PROVENANCE makes that `npm publish --provenance`.
          publish-script: npm run release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          create-github-releases: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NPM_CONFIG_PROVENANCE: 'true'
