# Publishes ng-health when a GitHub release is published (tag vX.Y.Z), or manually.
#
# Registry setup (repository → Settings → Secrets and variables → Actions):
#   vars.NPM_REGISTRY_URL  e.g. https://npm.example.internal/ (defaults to https://registry.npmjs.org/)
#   secrets.NPM_TOKEN      a token allowed to publish to that registry
# For a scoped package on an internal registry, rename "name" in package.json (e.g. @acme/ng-health).

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and validate without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: ${{ vars.NPM_REGISTRY_URL || 'https://registry.npmjs.org/' }}

      - run: npm ci

      - name: Tag matches package.json version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version v$version"
            exit 1
          fi

      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run

      - name: Publish
        if: github.event_name == 'release' || inputs.dry-run == false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          tag=latest
          if [ "$PRERELEASE" = "true" ] || node -p "require('./package.json').version" | grep -q -- '-'; then
            tag=next
          fi
          npm publish --tag "$tag"

      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: npm publish --dry-run
